server:
  port: ${PORT:8080}
spring:
  application:
    name: github-repository-searcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/github_repositories}
    username: ${DB_USERNAME:github_user}
    password: ${DB_PASSWORD:github_password}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: true
github:
  token: ${GITHUB_TOKEN:}
  per-page: 30
